<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Your fleet on one tailnet</title>
  <desc id="desc">All machines sit inside one private Tailscale tailnet using MagicDNS names, Tailscale SSH and ACL tags. odin, the cockpit laptop, runs the AI agents but no local models; it sends model calls to thor, the GPU box, which runs Ollama and the free-model router. heimdall, an always-on laptop, runs scheduled jobs, a watchdog, Pi-hole, uptime checks, backups and Wake-on-LAN; it wakes odin and thor if they are down and pushes a nightly append-only backup to thor. loki, the media laptop, runs Jellyfin for your own media with tag quarantine: others can reach it but it cannot initiate connections. raven, a thin client, and a phone for approvals and handoffs also join.</desc>
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
  </defs>
  <rect width="960" height="600" rx="20" fill="#0f172a"/>

  <text x="32" y="44" font-size="22" font-weight="700" fill="#f8fafc">Your fleet on one tailnet</text>

  <!-- tailnet boundary -->
  <rect x="24" y="74" width="912" height="508" rx="40" fill="#1e293b" fill-opacity="0.35" stroke="#cbd5e1" stroke-width="1.75" stroke-dasharray="8 6"/>
  <rect x="226" y="62" width="508" height="24" rx="12" fill="#0f172a"/>
  <text x="480" y="79" font-size="14" fill="#cbd5e1" text-anchor="middle"><tspan font-weight="700" fill="#f8fafc">Tailscale tailnet</tspan> · MagicDNS names · Tailscale SSH · ACL tags</text>

  <!-- odin -->
  <rect x="56" y="100" width="250" height="120" rx="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="72" y="124" width="46" height="32" rx="3" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M66,162 H124 L120,168 H70 Z" fill="#cbd5e1"/>
  <text x="134" y="132" font-size="16" font-weight="700" fill="#f8fafc">odin</text>
  <g font-size="13" fill="#cbd5e1">
    <text x="134" y="154">the cockpit</text>
    <text x="134" y="172">runs the AI agents</text>
    <text x="134" y="190">no local models</text>
  </g>

  <!-- thor -->
  <rect x="654" y="100" width="250" height="120" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="672" y="118" width="34" height="62" rx="4" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
  <line x1="678" y1="128" x2="700" y2="128" stroke="#fbbf24" stroke-width="2"/>
  <line x1="678" y1="136" x2="700" y2="136" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="689" cy="160" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="689" cy="160" r="2.5" fill="#fbbf24"/>
  <text x="720" y="132" font-size="16" font-weight="700" fill="#f8fafc">thor</text>
  <g font-size="13" fill="#cbd5e1">
    <text x="720" y="154">GPU box</text>
    <text x="720" y="172">Ollama local models</text>
    <text x="720" y="190">free-model router</text>
  </g>

  <!-- model calls -->
  <line x1="306" y1="160" x2="652" y2="160" stroke="#4ade80" stroke-width="2" marker-end="url(#ag)"/>
  <text x="480" y="150" font-size="13" fill="#4ade80" text-anchor="middle">model calls</text>

  <!-- heimdall -->
  <rect x="345" y="248" width="270" height="160" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
  <rect x="363" y="272" width="42" height="28" rx="3" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
  <path d="M357,305 H411 L407,311 H361 Z" fill="#fbbf24"/>
  <circle cx="596" cy="268" r="5" fill="#4ade80"/>
  <text x="421" y="280" font-size="16" font-weight="700" fill="#f8fafc">heimdall</text>
  <g font-size="13" fill="#cbd5e1">
    <text x="421" y="300">always-on laptop</text>
    <text x="363" y="336">scheduled jobs · watchdog</text>
    <text x="363" y="356">Pi-hole · uptime checks</text>
    <text x="363" y="376">backups · Wake-on-LAN</text>
  </g>

  <!-- heimdall arrows -->
  <path d="M345,290 H200 V222" fill="none" stroke="#fbbf24" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#aa)"/>
  <text x="272" y="282" font-size="13" fill="#fbbf24" text-anchor="middle">wake if down</text>
  <path d="M615,290 H760 V222" fill="none" stroke="#fbbf24" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#aa)"/>
  <text x="688" y="282" font-size="13" fill="#fbbf24" text-anchor="middle">wake if down</text>
  <path d="M615,360 H840 V222" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#aa)"/>
  <text x="727" y="352" font-size="13" fill="#fbbf24" text-anchor="middle">nightly backup (append-only)</text>

  <!-- media -->
  <rect x="56" y="440" width="280" height="120" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="72" y="464" width="46" height="32" rx="3" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
  <path d="M76,472 L76,488 L88,480 Z" fill="#fbbf24"/>
  <path d="M66,502 H124 L120,508 H70 Z" fill="#fbbf24"/>
  <text x="134" y="470" font-size="16" font-weight="700" fill="#f8fafc">loki</text>
  <g font-size="13" fill="#cbd5e1">
    <text x="134" y="490">old laptop</text>
    <text x="134" y="508">Jellyfin, your own media</text>
  </g>
  <rect x="134" y="520" width="124" height="24" rx="12" fill="#f87171" fill-opacity="0.15" stroke="#f87171"/>
  <text x="196" y="537" font-size="13" fill="#fca5a5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tag:quarantine</text>

  <!-- one-way rule -->
  <path d="M480,408 V478 H340" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#ag)"/>
  <text x="410" y="470" font-size="13" fill="#4ade80" text-anchor="middle">others can reach it</text>
  <line x1="336" y1="524" x2="428" y2="524" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="434" y1="512" x2="434" y2="536" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
  <text x="446" y="529" font-size="13" fill="#fca5a5">it can't initiate</text>

  <!-- raven -->
  <rect x="590" y="440" width="150" height="120" rx="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="646" y="454" width="38" height="26" rx="3" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M660,480 V487 M652,488 H678" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <text x="665" y="510" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">raven</text>
  <text x="665" y="528" font-size="13" fill="#cbd5e1" text-anchor="middle">remote seat via</text>
  <text x="665" y="546" font-size="13" fill="#cbd5e1" text-anchor="middle">Tailscale SSH</text>

  <!-- phone -->
  <rect x="764" y="440" width="140" height="120" rx="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="822" y="452" width="24" height="38" rx="5" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="834" cy="484" r="1.8" fill="#cbd5e1"/>
  <text x="834" y="510" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">phone</text>
  <text x="834" y="528" font-size="13" fill="#cbd5e1" text-anchor="middle">approvals</text>
  <text x="834" y="546" font-size="13" fill="#cbd5e1" text-anchor="middle">&amp; handoffs</text>
</svg>
