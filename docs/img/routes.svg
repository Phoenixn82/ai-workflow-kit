<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="currentColor">
  <title id="title">Routes: job, route, lane, model</title>
  <desc id="desc">Each kind of job maps to one task class (a route). Each route points at one lane, and each lane names one model and effort level in lanes.json. Opus 5.5 at xhigh serves hard engineering and verify stages; Opus 5.5 at high serves interactive sessions, normal builds, research, computer use and headless summaries; Haiku 5.5 serves bulk sweeps, code search and session distillation; Fable 5.1 serves only marketing pages and big visual overhauls; GPT-6.1 Sol serves long unattended builds and code review; GPT-6 Astra at xhigh serves plan and security review; GPT-6 Luna serves bulk image classification; a local 27B model on thor serves private data. There is no default lane. Snapshot of 2026-10-12; route list prints the live table.</desc>
  <style>
    svg { color: #1f2937; }
    @media (prefers-color-scheme: dark) { svg { color: #e5e7eb; } }
    .link { stroke: currentColor; stroke-opacity: 0.5; stroke-width: 1.5; fill: none; }
    .head { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; opacity: 0.7; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity="0.6"/></marker>
  </defs>
  <text x="24" y="40" font-size="22" font-weight="700">Every job names a route; the route picks the lane</text>
  <text x="24" y="66" opacity="0.8">No default lane. Lanes say model + effort, routes say which lane fits which job (framework/_system/lanes.json).</text>
  <text x="24" y="86" opacity="0.8">Snapshot of 2026-10-13: <tspan class="mono">route list</tspan> prints the live table, which the optional lane-intel job may update.</text>
