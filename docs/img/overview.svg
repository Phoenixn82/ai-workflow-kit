<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How the kit fits together</title>
  <desc id="desc">You ask AI agents (Claude, Codex, Gemini, free and local models). Agents load the skills layer (plugins, one skill per tool, reference docs). Skills call tools: web, lanes, memory and safety hooks. Tools run on your own fleet of machines (odin, thor, heimdall, loki) joined by a private Tailscale tailnet. Approvals and handoffs go to your phone.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <symbol id="wrench" viewBox="0 0 24 24"><path fill="none" stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
  </defs>
  <rect width="960" height="530" rx="20" fill="#0f172a"/>

  <text x="32" y="48" font-size="22" font-weight="700" fill="#f8fafc">How the kit fits together</text>

  <!-- column headers -->
  <g font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">
    <text x="74" y="104">You</text>
    <text x="253" y="104">AI agents</text>
    <text x="457" y="104">Skills layer</text>
    <text x="661" y="104">Tools</text>
    <text x="863" y="104">Your fleet</text>
  </g>

  <!-- You -->
  <circle cx="74" cy="208" r="16" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
  <path d="M44,268 a30,30 0 0 1 60,0 z" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="74" y="292" font-size="14" fill="#cbd5e1" text-anchor="middle">ideas &amp; asks</text>

  <!-- phone -->
  <rect x="58" y="318" width="32" height="54" rx="6" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
  <rect x="62" y="325" width="24" height="36" rx="2" fill="#334155"/>
  <circle cx="74" cy="366" r="2" fill="#f8fafc"/>
  <text x="74" y="392" font-size="13" fill="#cbd5e1" text-anchor="middle">phone</text>
  <text x="74" y="408" font-size="13" fill="#cbd5e1" text-anchor="middle">approvals</text>

  <!-- Agents -->
  <g font-size="15" font-weight="700" fill="#f8fafc">
    <rect x="178" y="128" width="150" height="52" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="178" y="128" width="6" height="32" rx="3" transform="translate(0,10)" fill="#fb923c"/>
    <text x="196" y="159">Claude</text>
    <rect x="178" y="192" width="150" height="52" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="178" y="192" width="6" height="32" rx="3" transform="translate(0,10)" fill="#2dd4bf"/>
    <text x="196" y="223">Codex</text>
    <rect x="178" y="256" width="150" height="52" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="178" y="256" width="6" height="32" rx="3" transform="translate(0,10)" fill="#60a5fa"/>
    <text x="196" y="287">Gemini</text>
    <rect x="178" y="320" width="150" height="52" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="178" y="320" width="6" height="32" rx="3" transform="translate(0,10)" fill="#4ade80"/>
    <text x="196" y="342">Free / local</text>
    <text x="196" y="360" font-size="13" font-weight="400" fill="#cbd5e1">models</text>
  </g>

  <!-- Skills -->
  <rect x="382" y="128" width="150" height="244" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <g font-size="13" fill="#f8fafc" text-anchor="middle">
    <rect x="425" y="146" width="64" height="28" rx="6" fill="#f472b6" fill-opacity="0.28" stroke="#f472b6"/>
    <text x="457" y="165">plugins</text>
    <rect x="405" y="184" width="104" height="28" rx="6" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6"/>
    <text x="457" y="203">tool skills</text>
    <rect x="391" y="222" width="132" height="28" rx="6" fill="#f472b6" fill-opacity="0.10" stroke="#f472b6"/>
    <text x="457" y="241">reference docs</text>
  </g>
  <use href="#wrench" x="418" y="272" width="32" height="32" stroke="#f472b6" stroke-width="2"/>
  <circle cx="490" cy="288" r="12" fill="none" stroke="#f472b6" stroke-width="7" stroke-dasharray="4.7 4.7"/>
  <circle cx="490" cy="288" r="9" fill="none" stroke="#f472b6" stroke-width="2.5"/>
  <text x="457" y="336" font-size="13" fill="#cbd5e1" text-anchor="middle">plain SKILL.md</text>
  <text x="457" y="353" font-size="13" fill="#cbd5e1" text-anchor="middle">files</text>

  <!-- Tools -->
  <g font-size="15" font-weight="700" fill="#f8fafc">
    <rect x="586" y="128" width="150" height="52" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="586" y="128" width="6" height="32" rx="3" transform="translate(0,10)" fill="#e2e8f0"/>
    <text x="602" y="150">web</text>
    <text x="602" y="168" font-size="13" font-weight="400" fill="#cbd5e1">read, act, handoff</text>
    <rect x="586" y="192" width="150" height="52" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="586" y="192" width="6" height="32" rx="3" transform="translate(0,10)" fill="#4ade80"/>
    <text x="602" y="214">lanes</text>
    <text x="602" y="232" font-size="13" font-weight="400" fill="#cbd5e1">free/local routing</text>
    <rect x="586" y="256" width="150" height="52" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="586" y="256" width="6" height="32" rx="3" transform="translate(0,10)" fill="#c084fc"/>
    <text x="602" y="278">memory</text>
    <text x="602" y="296" font-size="13" font-weight="400" fill="#cbd5e1">vault + briefs</text>
    <rect x="586" y="320" width="150" height="52" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <rect x="586" y="320" width="6" height="32" rx="3" transform="translate(0,10)" fill="#f87171"/>
    <text x="602" y="342">safety hooks</text>
    <text x="602" y="360" font-size="13" font-weight="400" fill="#cbd5e1">guards &amp; gates</text>
  </g>

  <!-- Fleet / tailnet -->
  <rect x="790" y="128" width="146" height="244" rx="22" fill="#1e293b" fill-opacity="0.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="863" y="152" font-size="13" fill="#cbd5e1" text-anchor="middle">Tailscale tailnet</text>
  <g font-size="14" fill="#f8fafc">
    <rect x="802" y="164" width="122" height="42" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="812" y="176" width="13" height="18" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/><line x1="815" y1="181" x2="822" y2="181" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="834" y="190">odin</text>
    <rect x="802" y="214" width="122" height="42" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="812" y="226" width="13" height="18" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/><line x1="815" y1="231" x2="822" y2="231" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="834" y="240">thor</text>
    <rect x="802" y="264" width="122" height="42" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="812" y="276" width="13" height="18" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/><line x1="815" y1="281" x2="822" y2="281" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="834" y="290">heimdall</text>
    <rect x="802" y="314" width="122" height="42" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="812" y="326" width="13" height="18" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/><line x1="815" y1="331" x2="822" y2="331" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="834" y="340">loki</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)">
    <line x1="124" y1="250" x2="176" y2="250"/>
    <line x1="328" y1="250" x2="380" y2="250"/>
    <line x1="532" y1="250" x2="584" y2="250"/>
    <line x1="736" y1="250" x2="788" y2="250"/>
  </g>
  <g font-size="13" fill="#cbd5e1" text-anchor="middle">
    <text x="151" y="240">ask</text>
    <text x="355" y="240">load</text>
    <text x="559" y="240">call</text>
    <text x="763" y="240">run on</text>
  </g>

  <!-- approvals path -->
  <path d="M661,372 V452 H74 V418" fill="none" stroke="#cbd5e1" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="368" y="443" font-size="13" fill="#cbd5e1" text-anchor="middle">approvals &amp; handoffs reach your phone: you tap, the agent continues</text>

  <text x="480" y="500" font-size="14" fill="#94a3b8" text-anchor="middle">Agents load skills, skills call tools, and tools run on machines you own, joined privately over Tailscale.</text>
</svg>
