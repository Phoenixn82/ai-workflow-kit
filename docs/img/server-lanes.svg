<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Turn an old laptop into a server</title>
  <desc id="desc">An old laptop can take one of three lanes. loki runs Jellyfin for your own media, Samba shares and a one-way firewall, and needs an Intel iGPU with Quick Sync and a big disk. heimdall runs always-on jobs, a watchdog, DNS and backups, and needs low power and any CPU. thor runs local AI models and heavy compute, and needs an NVIDIA GPU with 8 GB or more of VRAM, or Apple silicon, with 16 GB or more of memory. Each lane works on Linux (best), macOS and Windows.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <g id="os">
      <rect x="0" y="0" width="116" height="26" rx="13" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80"/>
      <path d="M12,13 l4,4 l8,-9" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="18" font-size="13" font-weight="700" fill="#f8fafc">Linux</text>
      <text x="76" y="18" font-size="13" fill="#bbf7d0">best</text>
      <rect x="0" y="32" width="116" height="26" rx="13" fill="none" stroke="#64748b"/>
      <text x="58" y="50" font-size="13" fill="#cbd5e1" text-anchor="middle">macOS</text>
      <rect x="0" y="64" width="116" height="26" rx="13" fill="none" stroke="#64748b"/>
      <text x="58" y="82" font-size="13" fill="#cbd5e1" text-anchor="middle">Windows</text>
    </g>
  </defs>
  <rect width="960" height="520" rx="20" fill="#0f172a"/>

  <text x="32" y="44" font-size="22" font-weight="700" fill="#f8fafc">Turn an old laptop into a server</text>

  <!-- old laptop -->
  <rect x="50" y="226" width="140" height="94" rx="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5"/>
  <rect x="60" y="236" width="120" height="74" rx="3" fill="#334155"/>
  <path d="M64,246 l22,0 M64,256 l40,0 M64,266 l30,0" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M36,324 H204 L196,336 H44 Z" fill="#cbd5e1"/>
  <text x="120" y="364" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">an old laptop</text>
  <text x="120" y="384" font-size="13" fill="#cbd5e1" text-anchor="middle">give it one job</text>

  <!-- fan out -->
  <g fill="none" stroke="#cbd5e1" stroke-width="2">
    <path d="M204,285 H228"/>
    <path d="M228,141 V429"/>
    <path d="M228,141 H256" marker-end="url(#ah)"/>
    <path d="M228,285 H256" marker-end="url(#ah)"/>
    <path d="M228,429 H256" marker-end="url(#ah)"/>
  </g>

  <!-- row cards -->
  <g fill="#1e293b" stroke="#fbbf24" stroke-width="1.5">
    <rect x="260" y="76" width="676" height="130" rx="14"/>
    <rect x="260" y="220" width="676" height="130" rx="14"/>
    <rect x="260" y="364" width="676" height="130" rx="14"/>
  </g>
  <g stroke="#334155" stroke-width="1">
    <line x1="440" y1="92" x2="440" y2="190"/><line x1="612" y1="92" x2="612" y2="190"/><line x1="798" y1="92" x2="798" y2="190"/>
    <line x1="440" y1="236" x2="440" y2="334"/><line x1="612" y1="236" x2="612" y2="334"/><line x1="798" y1="236" x2="798" y2="334"/>
    <line x1="440" y1="380" x2="440" y2="478"/><line x1="612" y1="380" x2="612" y2="478"/><line x1="798" y1="380" x2="798" y2="478"/>
  </g>

  <!-- icons -->
  <rect x="278" y="120" width="44" height="30" rx="4" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
  <path d="M294,127 V143 L307,135 Z" fill="#fbbf24"/>
  <path d="M292,156 H308" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="300" cy="285" r="20" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
  <path d="M300,285 V272 M300,285 L309,291" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="284" y="401" width="32" height="56" rx="4" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
  <path d="M290,410 H310 M290,417 H310" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="300" cy="439" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- names -->
  <g font-size="17" font-weight="700" fill="#f8fafc">
    <text x="336" y="136">loki</text>
    <text x="336" y="280">heimdall</text>
    <text x="336" y="424">thor</text>
  </g>
  <g font-size="13" fill="#cbd5e1">
    <text x="336" y="156">your streaming</text>
    <text x="336" y="300">on watch 24/7</text>
    <text x="336" y="444">heavy lifting</text>
  </g>

  <!-- runs / needs headers -->
  <g font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1">
    <text x="456" y="104">RUNS</text><text x="628" y="104">NEEDS</text>
    <text x="456" y="248">RUNS</text><text x="628" y="248">NEEDS</text>
    <text x="456" y="392">RUNS</text><text x="628" y="392">NEEDS</text>
  </g>
  <g font-size="14" fill="#f8fafc">
    <text x="456" y="128">Jellyfin</text>
    <text x="456" y="148">Samba shares</text>
    <text x="456" y="168">one-way firewall</text>
    <text x="628" y="128">Intel iGPU w/ Quick Sync</text>
    <text x="628" y="148">a big disk</text>

    <text x="456" y="272">always-on jobs</text>
    <text x="456" y="292">watchdog</text>
    <text x="456" y="312">DNS</text>
    <text x="456" y="332">backups</text>
    <text x="628" y="272">low power</text>
    <text x="628" y="292">any CPU</text>

    <text x="456" y="416">local AI models</text>
    <text x="456" y="436">heavy compute</text>
    <text x="628" y="416">NVIDIA GPU, 8 GB+</text>
    <text x="628" y="436">or Apple silicon</text>
    <text x="628" y="456">16 GB+ memory</text>
  </g>

  <!-- OS badges -->
  <use href="#os" x="810" y="96"/>
  <use href="#os" x="810" y="240"/>
  <use href="#os" x="810" y="384"/>
</svg>
