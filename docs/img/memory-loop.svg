<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">The memory loop</title>
  <desc id="desc">A circular loop. A session ends; a hook seals the transcript in milliseconds with zero tokens; it waits in a queue; Claude Haiku distills it, with a local model as the fallback; the result becomes vault notes (history, decisions, errors, lessons, RESUME, brief); the next session starts with a short brief injected and you get back to work. Alongside the loop, an open-loops sweep finds unfinished threads and a review queue inbox collects finished artifacts for you to check.</desc>
  <defs>
    <polygon id="tip" points="-8,-7 8,0 -8,7" fill="#c084fc"/>
  </defs>
  <rect width="960" height="560" rx="20" fill="#0f172a"/>

  <text x="32" y="44" font-size="22" font-weight="700" fill="#f8fafc">The memory loop</text>

  <!-- ring -->
  <ellipse cx="380" cy="315" rx="270" ry="185" fill="none" stroke="#c084fc" stroke-opacity="0.55" stroke-width="3"/>
  <use href="#tip" transform="translate(515,155) rotate(21.6)"/>
  <use href="#tip" transform="translate(650,315) rotate(90)"/>
  <use href="#tip" transform="translate(515,475) rotate(158.4)"/>
  <use href="#tip" transform="translate(245,475) rotate(201.6)"/>
  <use href="#tip" transform="translate(110,315) rotate(270)"/>
  <use href="#tip" transform="translate(245,155) rotate(-21.6)"/>
  <text x="232" y="140" font-size="13" fill="#d8b4fe" text-anchor="end">back to work</text>

  <!-- centre -->
  <g fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M378,236 c-8,-12 -30,-10 -32,6 c-14,3 -17,21 -7,29 c-6,13 5,27 19,24 c5,10 18,9 20,0 z"/>
    <path d="M382,236 c8,-12 30,-10 32,6 c14,3 17,21 7,29 c6,13 -5,27 -19,24 c-5,10 -18,9 -20,0 z"/>
    <path d="M360,256 c6,2 10,8 8,14 M400,256 c-6,2 -10,8 -8,14"/>
  </g>
  <text x="380" y="336" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">Memory loop</text>
  <text x="380" y="358" font-size="13" fill="#cbd5e1" text-anchor="middle">every session leaves notes;</text>
  <text x="380" y="376" font-size="13" fill="#cbd5e1" text-anchor="middle">every new session starts briefed</text>

  <!-- A: session ends -->
  <rect x="280" y="100" width="200" height="60" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="380" y="125" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Session ends</text>
  <text x="380" y="145" font-size="13" fill="#cbd5e1" text-anchor="middle">you close the chat</text>

  <!-- B: hook seals -->
  <rect x="514" y="192" width="200" height="60" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="614" y="217" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Hook seals transcript</text>
  <text x="614" y="237" font-size="13" fill="#cbd5e1" text-anchor="middle">milliseconds · zero tokens</text>

  <!-- C: queue -->
  <rect x="514" y="378" width="200" height="60" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="614" y="403" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Queue</text>
  <text x="614" y="423" font-size="13" fill="#cbd5e1" text-anchor="middle">waits for the worker</text>

  <!-- D: local model distills -->
  <rect x="280" y="470" width="200" height="60" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="380" y="495" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Haiku distills</text>
  <text x="380" y="515" font-size="13" fill="#cbd5e1" text-anchor="middle">local model as fallback</text>

  <!-- E: vault notes -->
  <rect x="36" y="340" width="220" height="120" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="146" y="363" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Vault notes</text>
  <g fill="#c084fc" fill-opacity="0.16" stroke="#c084fc" stroke-opacity="0.7">
    <rect x="46" y="374" width="98" height="22" rx="11"/><rect x="148" y="374" width="98" height="22" rx="11"/>
    <rect x="46" y="400" width="98" height="22" rx="11"/><rect x="148" y="400" width="98" height="22" rx="11"/>
    <rect x="46" y="426" width="98" height="22" rx="11"/><rect x="148" y="426" width="98" height="22" rx="11"/>
  </g>
  <g font-size="13" fill="#f8fafc" text-anchor="middle">
    <text x="95" y="390">history</text><text x="197" y="390">decisions</text>
    <text x="95" y="416">errors</text><text x="197" y="416">lessons</text>
    <text x="95" y="442">RESUME</text><text x="197" y="442">brief</text>
  </g>

  <!-- F: next session -->
  <rect x="46" y="192" width="200" height="60" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="146" y="217" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Next session starts</text>
  <text x="146" y="237" font-size="13" fill="#cbd5e1" text-anchor="middle">short brief injected</text>

  <!-- side panel -->
  <text x="840" y="120" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Alongside the loop</text>
  <rect x="744" y="138" width="192" height="116" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="760" y="164" font-size="15" font-weight="700" fill="#f8fafc">open-loops sweep</text>
  <g font-size="13" fill="#cbd5e1">
    <text x="760" y="186">weekly or on ask, finds</text>
    <text x="760" y="204">unfinished threads</text>
    <text x="760" y="222">across recent sessions</text>
  </g>
  <rect x="744" y="272" width="192" height="116" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="760" y="298" font-size="15" font-weight="700" fill="#f8fafc">review queue inbox</text>
  <g font-size="13" fill="#cbd5e1">
    <text x="760" y="320">finished files, plans</text>
    <text x="760" y="338">and reports land here</text>
    <text x="760" y="356">for you to check</text>
  </g>
</svg>
