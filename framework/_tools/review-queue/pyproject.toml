[project]
name = "review-queue"
version = "0.1.0"
description = "Paper icon in the Omarchy bar: images, videos, PDFs, HTML pages and Claude artifacts flagged for review, in one window."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rq = "review_queue.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_queue"]

