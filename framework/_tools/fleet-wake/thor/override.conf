[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
# 16384 total with ONE slot. More slots split the context and the KV cache:
#   4 slots -> 4096 per slot -> silently truncated every long extraction prompt
#   2 slots -> the KV cache can push layers to the CPU, much slower
#   1 slot  -> every layer on the GPU, full 16k context   <- correctness AND speed
Environment="OLLAMA_CONTEXT_LENGTH=16384"
Environment="OLLAMA_NUM_PARALLEL=1"
# With 1, every vault-recall/reindex embed evicted the big model, and embeds timed out behind the reloads.
# 2 = one big model + nomic-embed-text. nomic-embed-text:latest on thor is rebuilt with PARAMETER num_gpu 0
# (nomic-embed-text-cpu.Modelfile beside this file), so it loads CPU-only: Ollama's scheduler skips the VRAM
# fit check for num_gpu 0, so it never evicts a GPU model for VRAM. Two GPU models still co-reside only when both
# fully fit; otherwise Ollama evicts as before. The slot count still applies: if two small GPU models
# already fill both slots, an embed evicts one of them (3 would avoid that; needs a restart), and a big-model load
# drops the idle CPU nomic first (it reloads quickly). Check: ollama-embed-check (beside this file).
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# Do not hold GPU/RAM while idle. Callers that batch work
# (handoff-v2 drain) pass keep_alive per request and unload when done.
Environment="OLLAMA_KEEP_ALIVE=5m"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# Ollama will not split one model across two backends. If one card's driver is too old for the
# CUDA runner (it wants 570+), uncomment this line to put every card on Vulkan so a model can
# span all of them; leave it commented once every card runs CUDA.
#Environment="CUDA_VISIBLE_DEVICES=-1"
