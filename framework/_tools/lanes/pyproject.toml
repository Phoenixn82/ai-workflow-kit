[project]
name = "lanes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
lane = "lanes.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lanes"]
