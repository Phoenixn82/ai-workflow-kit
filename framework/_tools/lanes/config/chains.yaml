# Lane chains, in priority order. Ids are exact catalog modelIds; one model can appear under several ids
# (e.g. Groq's openai/gpt-oss-120b is Ollama Cloud's gpt-oss:120b). `lane chains sync` builds a public
# profile <lane> and a business profile <lane>-biz from the enabled entries each tier allows.
extract: [openai/gpt-oss-120b, gpt-oss:120b, poolside/laguna-s-2.1:free, nvidia/nemotron-3-ultra-550b-a55b, nemotron-3-ultra, openai/gpt-oss-20b, gpt-oss:20b, mistral-code-latest]
