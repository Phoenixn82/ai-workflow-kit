quick: [openai/gpt-oss-120b, gpt-oss:120b, openai/gpt-oss-20b, gpt-oss:20b]
public: [openai/gpt-oss-120b, gpt-oss:120b, poolside/laguna-s-2.1:free, nvidia/nemotron-3-ultra-550b-a55b, nemotron-3-ultra, openai/gpt-oss-20b, gpt-oss:20b, mistral-code-latest, agnes-2.5-flash]
