# `fast` is a reserved router name (built-in auto:fast), so the interactive lane is `quick`.
# The router's balanced strategy ignores profile priority and favours nemotron, so the checker
# holds no nemotron: writer drafts (mostly nemotron) and checks (gpt-oss/qwen) stay different families.
