# loki: the media library shared with the house's computers, read-only (profiles/loki/README.md "Samba").
# Install, from the kit's root folder:
#   sudo apt install samba
#   sudo cp profiles/loki/samba/media-share.conf /etc/samba/media-share.conf
#   add under [global] in /etc/samba/smb.conf:   include = /etc/samba/media-share.conf
#   sudo usermod -aG sambashare "$USER" && sudo smbpasswd -a "$USER"
#   testparm -s >/dev/null && sudo systemctl restart smbd
#   sudo servers/linux/setup.sh loki --only=firewall      (opens TCP 445 to the home network while this file exists)
#   then, from a NEW ssh session within 5 minutes: sudo servers/linux/setup.sh --confirm-firewall
# Connect: smb://loki.local/media (macOS, Linux) or \\loki\media (Windows), with that user and Samba password.
# Read-only for everyone: nothing from the house can change or add to the library (downloads stay quarantined).

[media]
   comment = loki media library (read-only)
   path = /srv/media/media
   browseable = yes
   read only = yes
   guest ok = no
   valid users = @sambashare
   # no symlinks out of the share, no hidden dotfiles shown
   follow symlinks = no
   wide links = no
   hide dot files = yes
