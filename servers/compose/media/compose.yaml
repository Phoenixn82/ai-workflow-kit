# Media lane: Jellyfin (profile "core") + optional download stack (profile "arr").
#   docker compose --profile core up -d                  # Jellyfin only
#   docker compose --profile core --profile arr up -d    # everything
# Copy env.example to .env first and fill it in.
#
# How the "arr" side is wired:
# - gluetun is a WireGuard VPN tunnel with a killswitch. transmission, prowlarr and flaresolverr share its
#   network namespace (network_mode: service:gluetun): if the tunnel is down they have NO network at all.
# - Their web UIs are therefore published on the gluetun container (9091, 9696).
# - Containers inside gluetun cannot resolve compose service names, so radarr/sonarr get fixed IPs and
#   prowlarr reaches them as 172.30.0.10:7878 and 172.30.0.11:8989. Change the subnet and both IPs together
#   if 172.30.0.0/24 clashes with your LAN.
# - After recreating gluetun you MUST recreate its dependents, or they keep running with no network:
#   docker compose up -d --force-recreate transmission prowlarr flaresolverr   (port-sync.sh does it for you)
# - One DATA_DIR mounted as /data everywhere, so downloads and the library are on the same filesystem and
#   radarr/sonarr can hardlink instead of copying.
# - Every port binds to BIND_IP (default 127.0.0.1). Docker publishes ports AROUND the host firewall, so
#   0.0.0.0 would expose them to the whole LAN. Reach them over the tailnet with `tailscale serve` (media.md).
name: media

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    profiles: [core]
    container_name: jellyfin
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ${DATA_DIR:-/srv/media}/media:/media:ro
    ports:
      - ${JELLYFIN_BIND:-127.0.0.1}:8096:8096
    mem_limit: 2g
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    profiles: [arr]
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      TZ: ${TZ:-Etc/UTC}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-}   # required for the arr profile (set in .env)
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      VPN_PORT_FORWARDING_STATUS_FILE: /tmp/gluetun/forwarded_port
      FIREWALL_OUTBOUND_SUBNETS: 172.30.0.0/24   # prowlarr -> radarr/sonarr on the compose network
    volumes:
      - ./gluetun:/gluetun
    ports:
      - ${BIND_IP:-127.0.0.1}:9091:9091   # transmission web UI
      - ${BIND_IP:-127.0.0.1}:9696:9696   # prowlarr
    mem_limit: 256m
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    profiles: [arr]
    container_name: transmission
    network_mode: service:gluetun
    depends_on: [gluetun]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      USER: ${TRANSMISSION_USER:-}   # web UI login: set both in .env
      PASS: ${TRANSMISSION_PASS:-}
    volumes:
      - ./transmission:/config
      - ${DATA_DIR:-/srv/media}:/data
    mem_limit: 512m
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    profiles: [arr]
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on: [gluetun]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./prowlarr:/config
    mem_limit: 512m
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    profiles: [arr]
    container_name: flaresolverr
    network_mode: service:gluetun   # prowlarr reaches it as http://localhost:8191
    depends_on: [gluetun]
    environment:
      TZ: ${TZ:-Etc/UTC}
    mem_limit: 1g
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    profiles: [arr]
    container_name: radarr
    networks:
      default:
        ipv4_address: 172.30.0.10   # fixed: prowlarr (inside gluetun) cannot resolve names
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./radarr:/config
      - ${DATA_DIR:-/srv/media}:/data
    ports:
      - ${BIND_IP:-127.0.0.1}:7878:7878
    mem_limit: 512m
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    profiles: [arr]
    container_name: sonarr
    networks:
      default:
        ipv4_address: 172.30.0.11   # fixed: prowlarr (inside gluetun) cannot resolve names
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./sonarr:/config
      - ${DATA_DIR:-/srv/media}:/data
    ports:
      - ${BIND_IP:-127.0.0.1}:8989:8989
    mem_limit: 512m
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0   # request page for the household (successor of Jellyseerr)
    profiles: [arr]
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./seerr:/app/config
    ports:
      - ${BIND_IP:-127.0.0.1}:5055:5055
    mem_limit: 512m
    restart: unless-stopped
