# Workhorse lane, container variant of Ollama. (On Linux, setup.sh installs Ollama natively instead,
# which is simpler; on macOS use the native app, since containers there cannot use the Apple GPU.)
# Pick ONE profile:
#   docker compose --profile cpu up -d       # CPU only
#   docker compose --profile nvidia up -d    # NVIDIA GPU (host needs the NVIDIA driver + nvidia-container-toolkit;
#                                            # Docker Desktop on Windows: WSL2 GPU support, recent NVIDIA driver)
# Then: docker compose exec ollama ollama pull qwen3:8b
#
# The API binds to 127.0.0.1. Share it with the tailnet (not the LAN):
#   tailscale serve --bg --tcp=11434 tcp://127.0.0.1:11434
#
# FreeLLMAPI (optional free-tier model router) is not in this file: tools/freellmapi-bootstrap.sh installs
# it as a loopback-only user service. See workhorse.md.
name: workhorse

x-ollama: &ollama
  image: ollama/ollama:0.33.3          # the version tools.json installs natively
  environment:
    OLLAMA_KEEP_ALIVE: 5m          # unload a model 5 min after its last use (frees RAM/VRAM)
    OLLAMA_NUM_PARALLEL: "1"       # one request at a time: predictable memory on a small box
    OLLAMA_MAX_LOADED_MODELS: "1"
  volumes:
    - ollama:/root/.ollama
  ports:
    - ${BIND_IP:-127.0.0.1}:11434:11434
  restart: unless-stopped

services:
  ollama:
    <<: *ollama
    profiles: [cpu]
    container_name: ollama

  ollama-nvidia:
    <<: *ollama
    profiles: [nvidia]
    container_name: ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
