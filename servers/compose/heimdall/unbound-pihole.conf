# /etc/unbound/unbound.conf.d/pihole.conf  -- Pi-hole's upstream resolver on heimdall.
# Forwards every lookup over DNS-over-TLS, so your ISP / the network owner sees no plain DNS queries.
#   sudo apt install unbound && sudo cp unbound-pihole.conf /etc/unbound/unbound.conf.d/pihole.conf
#   sudo systemctl restart unbound && dig @127.0.0.1 -p 5335 example.com
server:
    interface: 127.0.0.1
    port: 5335
    do-ip6: no
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    prefetch: yes

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
